<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu Items</title>
</head>
<body>
    <h1>Menu Items</h1>

    <div th:if="${successMessage}" th:text="${successMessage}"></div>

    <p>
        <a th:href="@{/menu/new}">Add New Item</a>
    </p>

    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(menuItems)}">
                <td colspan="6">No items available.</td>
            </tr>
            <tr th:each="item : ${menuItems}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.category}"></td>
                <td th:text="${item.price}"></td>
                <td th:text="${item.stockQuantity}"></td>
                <td>
                    <a th:href="@{/menu/edit/{id}(id=${item.id})}">Edit</a>
                    <form th:action="@{/menu/delete/{id}(id=${item.id})}" method="post" style="display:inline;"
                          onsubmit="return confirm('Are you sure you want to delete this item?');">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
