<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Detail</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 6px; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Task Detail</h1>

        <p><strong>ID:</strong> <span th:text="${task.id}"></span></p>
        <p><strong>Title:</strong> <span th:text="${task.title}"></span></p>
        <p><strong>Description:</strong> <span th:text="${task.description}"></span></p>
        <p><strong>Completed:</strong> <span th:text="${task.completed}"></span></p>

        <p><a th:href="@{/tasks}">Back to Task List</a></p>
    </div>
</body>
</html>
