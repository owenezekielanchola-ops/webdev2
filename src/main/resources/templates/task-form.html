<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Task</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 6px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 6px; box-sizing: border-box; }
        .error { color: red; font-size: 14px; display: block; margin-top: 4px; }
        button { padding: 8px 16px; cursor: pointer; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Create Task</h1>

        <form th:action="@{/tasks}" th:object="${task}" method="post">
            <p>
                <label>Title:</label>
                <input type="text" th:field="*{title}">
                <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </p>

            <p>
                <label>Description:</label>
                <textarea rows="3" th:field="*{description}"></textarea>
                <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </p>

            <p>
                <label>
                    <input type="checkbox" th:field="*{completed}"> Completed
                </label>
            </p>

            <button type="submit">Save</button>
        </form>

        <p><a th:href="@{/tasks}">Back to Task List</a></p>
    </div>
</body>
</html>
