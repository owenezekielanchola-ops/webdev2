<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Menu Item</title>
</head>
<body>
    <h1>Edit Menu Item</h1>

    <form th:action="@{/menu/update/{id}(id=*{id})}" th:object="${menuItem}" method="post">
        <input type="hidden" th:field="*{id}" />

        <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" th:field="*{name}" />
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red;"></span>
        </p>

        <p>
            <label for="category">Category:</label><br>
            <input type="text" id="category" th:field="*{category}" />
            <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" style="color:red;"></span>
        </p>

        <p>
            <label for="price">Price:</label><br>
            <input type="number" step="0.01" id="price" th:field="*{price}" />
            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:red;"></span>
        </p>

        <p>
            <label for="stockQuantity">Stock Quantity:</label><br>
            <input type="number" id="stockQuantity" th:field="*{stockQuantity}" />
            <span th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}" style="color:red;"></span>
        </p>

        <button type="submit">Update</button>
        <a th:href="@{/menu}">Cancel</a>
    </form>
</body>
</html>
